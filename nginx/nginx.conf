events {}

http {
    # Round robin: Nginx distribuye las solicitudes entre las réplicas en orden.
    upstream api_backend {
        server api1:3000;
        server api2:3000;
        server api3:3000;
    }

    server {
        listen 80;
        server_name _;

        # Conserva /api/... para que coincida con las rutas del backend.
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream $upstream_addr always;
        }

        # La aplicación React es servida por el contenedor frontend.
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
