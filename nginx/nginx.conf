events {}

http {
    # Round robin: Nginx distribuye las solicitudes entre las réplicas en orden.
    # Si una réplica no responde, se saltea durante 10 s y el pedido pasa a la siguiente.
    upstream api_backend {
        server api1:3000 max_fails=1 fail_timeout=10s;
        server api2:3000 max_fails=1 fail_timeout=10s;
        server api3:3000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Conserva /api/... para que coincida con las rutas del backend.
        location /api/ {
            proxy_pass http://api_backend;
            proxy_connect_timeout 2s;   # réplica caída: no esperar 60 s para pasar a otra
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream $upstream_addr always;
        }

        # La aplicación React es servida por el contenedor frontend.
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
